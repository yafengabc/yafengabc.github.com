# yafeng 的博客 —— 使用 Hugo Relearn 主题
baseURL: 'https://yafengabc.github.io/'
title: 'yafeng 的博客'
# 语言设为简体中文
locale: 'zh-cn'
# 用 git 提交时间作为文章更新时间
enableGitInfo: true
paginate: 10

# 主题
theme: 'relearn'

# 永久链接配置：移除posts层级，文章直接放在根目录
permalinks:
  posts: /:slug/

# 代码高亮 / 允许 Markdown 内嵌原始 HTML
markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    lineNos: false

# Relearn 主题参数
params:
  author:
    name: 'yafeng'
  # 侧边栏 / 顶栏标题
  linkTitle: 'yafeng 的博客'
  # 颜色变体（默认蓝白；右侧切换器可改中性暗色 / 浅绿）
  themeVariant:
    - { identifier: 'blue', name: '蓝白' }
    - { identifier: 'zen-dark', name: '暗色' }
    - { identifier: 'relearn-light', name: '浅绿' }
  # 搜索（Relearn 内置 lunr 搜索）
  search:
    disable: ''
  # 侧边栏菜单排序与折叠
  ordersectionsby: 'weight'
  collapsibleMenu: true
  showVisitedLinks: false
  disableLandingPageButton: true
  # 侧边栏快捷方式区不显示英文标题
  disableShortcutsTitle: true
  # 内容显示
  highlightWrap: true
  dateFormat: ':date_long'
  titleSeparator: '::'
  # 社交链接（显示在页脚）
  social:
    - name: 'GitHub'
      url: 'https://github.com/yafengabc'
      icon: 'github'
  # 页脚
  footer:
    content: '© 2026 yafeng · 保留所有权利'

# 侧边栏快捷方式（指向博客常用页面）
menu:
  shortcuts:
    - name: '文章'
      url: '/'
      weight: 1
    - name: '标签'
      url: '/tags/'
      weight: 2
    - name: '归档'
      url: '/archives/'
      weight: 3
